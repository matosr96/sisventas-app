# SPA: toda ruta desconocida devuelve index.html y Angular enruta. Los assets con hash se cachean
# un año; index.html y config.json nunca, para que un despliegue o un cambio de API_URL se vean al instante.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /index.html { add_header Cache-Control "no-store" always; }
  location = /config.json { add_header Cache-Control "no-store" always; }
  location = /manifest.webmanifest { add_header Cache-Control "no-store" always; }

  location ~* \.(js|css|woff2?|svg|png|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
