# Cabeceras de seguridad. nginx NO hereda add_header en un location que declara el suyo, así que este
# archivo se incluye en el server y en cada location que añade Cache-Control.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# CSP: ningún script que no venga del propio panel (el token vive en localStorage y esta es la barrera
# contra XSS). Estilos inline los necesita Angular; fuentes e iconos vienen de los CDN listados.
# connect-src queda abierto a https y a localhost porque la URL de la API se decide en tiempo de ejecución.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
