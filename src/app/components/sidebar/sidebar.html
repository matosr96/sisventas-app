<aside class="sidebar" [class.collapsed]="ui.sidebarCollapsed()" [class.open]="ui.sidebarOpen()">
  <div class="brand">
    <app-logo [variant]="ui.sidebarCollapsed() ? 'mark' : 'logotipo'" />
    <button type="button" class="collapse" (click)="ui.toggleSidebar()" [attr.aria-label]="ui.sidebarCollapsed() ? 'Expandir menú' : 'Contraer menú'" [title]="ui.sidebarCollapsed() ? 'Expandir menú' : 'Contraer menú'">
      <i class="bx" [class]="'bx ' + (ui.sidebarCollapsed() ? 'bx-chevron-right' : 'bx-chevron-left')"></i>
    </button>
  </div>
  <nav class="nav">
    @for (item of items(); track item.url) {
      @if (item.section) { <span class="section">{{ item.section }}</span> }
      <a class="link" [routerLink]="item.url" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.url === '/' }" (click)="ui.closeSidebar()" [title]="item.name">
        <i class="bx" [class]="'bx ' + item.icon"></i>
        <span class="link_name">{{ item.name }}</span>
      </a>
    }
  </nav>
  <footer class="footer">
    <a class="user" [routerLink]="profileRoute" (click)="ui.closeSidebar()" title="Mi perfil">
      <i class="bx bx-user-circle"></i>
      <span class="link_name">{{ auth.fullName() }}</span>
    </a>
    <div class="theme"><app-theme-toggle /></div>
    <button type="button" class="link logout" (click)="logout()" title="Salir">
      <i class="bx bx-log-out"></i>
      <span class="link_name">Salir</span>
    </button>
  </footer>
</aside>
@if (ui.sidebarOpen()) { <button type="button" class="backdrop" (click)="ui.closeSidebar()" aria-label="Cerrar menú"></button> }
