<app-layout>
  <app-header-page title="Productos" icon="bx-package" [items]="['Inicio', 'Productos']" searchPlaceholder="SKU o nombre…"
    [nameButton]="auth.isAdmin() ? 'Crear producto' : ''" [(searchTerm)]="list.searchTerm" (create)="creating.set(true)">
    <ng-container filters>
      <app-filter-chips label="Estado" [options]="statusOptions" [value]="statusFilter()" (valueChange)="list.setFilter('status', $event)" />
      @if (categoryOptions().length > 0) {
        <app-filter-chips label="Categoría" [options]="categoryOptions()" [value]="categoryFilter()" (valueChange)="list.setFilter('categoryId', $event)" />
      }
    </ng-container>
  </app-header-page>
  @if (list.isLoading()) {
    <app-skeleton />
  } @else if (list.isError()) {
    <p class="error">No se pudo cargar el catálogo. Reintenta en unos segundos.</p>
  } @else if (list.items().length === 0) {
    <app-empty title="Productos" copy="Crea el primer producto del catálogo con su SKU, precio y stock inicial."
      [buttonName]="auth.isAdmin() ? 'Crear producto' : ''" (create)="creating.set(true)" />
  } @else if (rows().length === 0) {
    <app-empty variant="no-results" (clear)="list.clearFilters()" />
  } @else {
    <app-table [data]="rows()" [headers]="['SKU', 'Nombre', 'Precio', 'Stock', 'Estado']"
      [keys]="['sku', 'name', 'priceLabel', 'stockCell', 'statusCell']" [numericKeys]="['priceLabel', 'stockCell']" [screenName]="screen"
      (rowClick)="open($event)" (edit)="edit($event)" (remove)="remove($event)" />
  }
</app-layout>
<app-create-product [open]="creating()" (closed)="creating.set(false)" />
@if (editing(); as product) {
  <app-update-product [product]="product" (closed)="editing.set(null)" />
}
