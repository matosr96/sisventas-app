<app-layout>
  <app-header-page title="Compras" icon="bx-cart-download" [items]="['Inicio', 'Compras']" searchPlaceholder="Número de compra…" nameButton="Registrar compra" [(searchTerm)]="list.searchTerm" (create)="create()">
    <app-date-range filters [value]="range()" (valueChange)="setRange($event)" />
  </app-header-page>
  @if (list.isLoading()) { <app-skeleton /> }
  @else if (list.isError()) { <p class="error">No se pudieron cargar las compras. Reintenta en unos segundos.</p> }
  @else if (list.count() === 0 && !list.hasFilters()) {
    <app-empty title="Compras" copy="Registra la primera compra a proveedor: suma stock y congela el costo." buttonName="Registrar compra" (create)="create()" />
  } @else if (list.count() === 0) {
    <app-empty variant="no-results" (clear)="list.clearFilters()" />
  } @else {
    <app-table [data]="rows()" [headers]="['Número', 'Proveedor', 'Fecha', 'Líneas', 'Total']" [keys]="['number', 'supplierName', 'date', 'lines', 'total']" [numericKeys]="['lines', 'total']" [screenName]="screen"
      [total]="list.count()" [query]="list.tableQuery()" [sortableKeys]="['number', 'date', 'total']" (queryChange)="list.onQuery($event)" (rowClick)="open($event)" (remove)="remove($event)" />
  }
</app-layout>
