<app-layout>
  <app-header-page title="Ventas" icon="bx-receipt" [items]="['Inicio', 'Ventas']" searchPlaceholder="Número de factura…" nameButton="Registrar venta" [(searchTerm)]="list.searchTerm" (create)="create()" />
  @if (list.isLoading()) { <app-skeleton /> }
  @else if (list.isError()) { <p class="error">No se pudieron cargar las ventas. Reintenta en unos segundos.</p> }
  @else if (list.items().length === 0) {
    <app-empty title="Ventas" copy="Registra la primera venta: elige productos y cantidades; el precio y el total los pone el sistema." buttonName="Registrar venta" (create)="create()" />
  } @else if (rows().length === 0) {
    <app-empty variant="no-results" (clear)="list.clearFilters()" />
  } @else {
    <app-table [data]="rows()" [headers]="['Número', 'Fecha', 'Líneas', 'Total']" [keys]="['saleNumber', 'dateLabel', 'lines', 'totalLabel']" [numericKeys]="['lines', 'totalLabel']" [screenName]="screen" (rowClick)="open($event)" (remove)="remove($event)" />
  }
</app-layout>
