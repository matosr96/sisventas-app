<app-layout>
  <app-header-page title="Usuarios" icon="bx-group" [items]="['Inicio', 'Usuarios']" nameButton="Crear usuario" [(searchTerm)]="list.searchTerm" (create)="creating.set(true)" />
  @if (list.isLoading()) { <app-loader /> }
  @else if (list.isError()) { <p class="error">No se pudieron cargar los usuarios. Reintenta en unos segundos.</p> }
  @else if (rows().length > 0) {
    <app-table [data]="rows()" [headers]="['Usuario', 'Nombre', 'Rol', 'Estado']" [keys]="['username', 'fullName', 'roleLabel', 'statusLabel']" [screenName]="screen" (edit)="edit($event)" />
  } @else {
    <app-empty title="Usuarios" copy="Crea el primer usuario del equipo." buttonName="Crear usuario" (create)="creating.set(true)" />
  }
</app-layout>
<app-create-user [open]="creating()" (closed)="creating.set(false)" />
@if (editing(); as user) { <app-update-user [user]="user" (closed)="editing.set(null)" /> }
